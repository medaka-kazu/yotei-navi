<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ea">
<title>予定ナビ Ver.1.2</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f7f4ea;
  --card:#ffffff;
  --ink:#222;
  --muted:#777;
  --accent:#2f6b4f;
  --line:#ded8c8;
  --done:#ececec;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:720px;
  margin:auto;
  padding:22px 14px 100px;
  min-height:100vh;
}
header{text-align:center;margin-bottom:18px}
#date{
  font-weight:800;
  font-size:clamp(30px,9vw,46px);
}
.sub{
  font-size:18px;
  color:var(--muted);
  margin-top:6px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}
h2{font-size:28px;margin:0 0 10px}
.empty{
  padding:28px 8px;
  text-align:center;
  color:var(--muted);
  font-size:20px;
}
.item{
  display:grid;
  grid-template-columns:86px 1fr 58px;
  gap:10px;
  align-items:center;
  padding:14px 4px;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:none}
.item.done{
  background:var(--done);
  border-radius:14px;
  opacity:.7;
}
.time{
  font-size:23px;
  font-weight:800;
  color:var(--accent);
}
.title{
  font-size:23px;
  font-weight:700;
  line-height:1.35;
}
.item.done .title{text-decoration:line-through}
button{
  border:none;
  border-radius:17px;
  min-height:56px;
  font-size:20px;
  font-weight:800;
  -webkit-appearance:none;
  appearance:none;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#ece7db;color:#333}
.donebtn{
  background:#e4f0e8;
  color:var(--accent);
  width:58px;
}
footer{
  text-align:center;
  margin-top:28px;
  color:#8a8a8a;
  font-size:14px;
}

/* 予定追加シート */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  z-index:1000;
}
.overlay.show{display:flex}
.sheet{
  width:min(100%,560px);
  background:#fff;
  border-radius:24px 24px 18px 18px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.28);
}
.sheet h3{
  font-size:27px;
  margin:0 0 12px;
}
label{
  display:block;
  font-weight:800;
  font-size:18px;
  margin:14px 0 6px;
}
input{
  width:100%;
  min-height:58px;
  font-size:23px;
  padding:10px 12px;
  border:1px solid #ccc;
  border-radius:14px;
  background:#fff;
}
input[type="time"]{
  font-size:26px;
  font-weight:700;
}
.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}
.hint{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}
@media (max-width:430px){
  .item{grid-template-columns:76px 1fr 54px}
  .time,.title{font-size:21px}
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div id="date"></div>
    <div class="sub">今日の予定を大きく、ひと目で。</div>
  </header>

  <section class="card">
    <h2>今日の予定</h2>
    <div id="list"></div>
  </section>

  <div class="actions">
    <button id="addBtn" class="primary" type="button">＋ 予定を追加</button>
    <button id="clearBtn" class="secondary" type="button">✅ 完了を整理</button>
  </div>

  <footer>予定ナビ Ver.1.2</footer>
</main>

<div id="overlay" class="overlay" aria-hidden="true">
  <div class="sheet">
    <h3>予定を追加</h3>

    <label for="timeInput">時間</label>
    <input id="timeInput" type="time" value="09:00" step="300">
    <div class="hint">iPhoneのSafariでは、ここをタップすると「時・分」を指でクルクル選べます。</div>

    <label for="titleInput">予定</label>
    <input id="titleInput" type="text" maxlength="80" placeholder="例：買い物">

    <div class="sheet-actions">
      <button id="cancelBtn" type="button" class="secondary">やめる</button>
      <button id="saveBtn" type="button" class="primary">追加する</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = "yotei_navi_v1_2";
  function $(id){ return document.getElementById(id); }

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function dateText(){
    var d = new Date();
    var wk = ["日","月","火","水","木","金","土"];
    return (d.getMonth()+1)+"月"+d.getDate()+"日（"+wk[d.getDay()]+"）";
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(items){
    try{
      localStorage.setItem(KEY, JSON.stringify(items));
      return true;
    }catch(e){
      alert("予定を保存できませんでした。Safariで開いて試してください。");
      return false;
    }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
    });
  }
  function render(){
    $("date").textContent = dateText();

    var all = load();
    var items = all.filter(function(x){ return x.date === todayKey(); });
    items.sort(function(a,b){ return a.time.localeCompare(b.time); });

    var list = $("list");
    if(items.length === 0){
      list.innerHTML = '<div class="empty">今日はまだ予定がありません。</div>';
      return;
    }

    list.innerHTML = "";
    items.forEach(function(x){
      var row = document.createElement("div");
      row.className = "item" + (x.done ? " done" : "");
      row.innerHTML =
        '<div class="time">'+esc(x.time)+'</div>'+
        '<div class="title">'+esc(x.title)+'</div>'+
        '<button type="button" class="donebtn">'+(x.done ? "↩" : "✓")+'</button>';

      row.querySelector(".donebtn").onclick = function(){
        var data = load();
        for(var i=0;i<data.length;i++){
          if(data[i].id === x.id){
            data[i].done = !data[i].done;
            break;
          }
        }
        save(data);
        render();
      };

      list.appendChild(row);
    });
  }

  function openSheet(){
    $("overlay").classList.add("show");
    $("overlay").setAttribute("aria-hidden","false");
    $("timeInput").value = "09:00";
    $("titleInput").value = "";
  }
  function closeSheet(){
    $("overlay").classList.remove("show");
    $("overlay").setAttribute("aria-hidden","true");
  }

  $("addBtn").onclick = openSheet;
  $("cancelBtn").onclick = closeSheet;

  $("saveBtn").onclick = function(){
    var time = $("timeInput").value;
    var title = $("titleInput").value.trim();

    if(!time){
      alert("時間を選んでください。");
      return;
    }
    if(!title){
      alert("予定を入れてください。");
      return;
    }

    var data = load();
    data.push({
      id: String(Date.now()) + "_" + String(Math.random()).slice(2),
      date: todayKey(),
      time: time,
      title: title,
      done: false
    });

    if(save(data)){
      closeSheet();
      render();
    }
  };

  $("clearBtn").onclick = function(){
    var data = load();
    var exists = data.some(function(x){ return x.date === todayKey() && x.done; });

    if(!exists){
      alert("完了した予定はまだありません。");
      return;
    }

    if(confirm("今日の完了済み予定を削除しますか？")){
      data = data.filter(function(x){ return !(x.date === todayKey() && x.done); });
      save(data);
      render();
    }
  };

  $("overlay").onclick = function(e){
    if(e.target === $("overlay")) closeSheet();
  };

  render();

  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
